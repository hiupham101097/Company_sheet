name = "company-sheet"
main = "worker/index.js"
compatibility_date = "2024-09-23"

# Cloudflare Static Assets (Frontend React)
[assets]
directory = "dist"
not_found_handling = "single-page-application"

# Cloudflare D1 Native Database Binding
[[d1_databases]]
binding = "DB"
database_name = "company_assets_db"
database_id = "f3eb46fc-b6e0-4c24-9e87-032ce24abb7d"

[vars]
GEMINI_MODEL = "gemini-3.8-flash"
GEMINI_PROJECT = "projects/800116604540"

# Tự động quét và làm mới thông báo nhắc hạn mỗi ngày lúc 6:00 sáng (Giờ Việt Nam UTC+7 = 23:00 UTC)
[triggers]
crons = ["0 23 * * *"]
